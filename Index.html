<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image to PDF - by Abdulmunem</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root { --main: #6c5ce7; --bg: #f8f9ff; }
  body { font-family: 'Segoe UI', Tahoma; background: var(--bg); margin:0; padding:20px; }
 .container { max-width: 900px; margin: auto; background: white; border-radius: 20px; padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); }
  h1 { text-align: center; color: var(--main); }
 .drop-zone { border: 3px dashed #a29bfe; border-radius: 15px; padding: 50px; text-align: center; cursor: pointer; transition: 0.3s; background: #f9f8ff; }
 .drop-zone.dragover { background: #e8e5ff; transform: scale(1.02); }
  #preview { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 15px; margin-top: 25px; }
 .img-card { position: relative; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
 .img-card img { width: 100%; height: 130px; object-fit: cover; }
 .img-card button { position: absolute; top:5px; left:5px; background: #ff7675; color:white; border:0; border-radius:50%; width:25px; height:25px; cursor:pointer; }
 .controls { margin-top: 25px; display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; }
  select, button.convert { padding: 12px 25px; border-radius: 10px; border: 1px solid #ddd; font-size: 16px; }
  button.convert { background: var(--main); color: white; border: 0; cursor: pointer; font-weight: bold; flex: 1; }
  button.convert:hover { background: #5641e5; }
 .footer { text-align: center; margin-top: 20px; color: #888; font-size: 14px; }
</style>
</head>
<body>
<div class="container">
  <h1>📸 تحويل الصور الى PDF</h1>
  <p style="text-align:center;color:#666">مستوحى من مستودع y6nm/Pdf</p>

  <div class="drop-zone" id="dropZone">
    <h3>اسحب الصور الى هنا او اضغط للاختيار</h3>
    <p>يدعم JPG, PNG, WEBP</p>
    <input type="file" id="fileInput" accept="image/*" multiple hidden>
  </div>

  <div id="preview"></div>

  <div class="controls">
    <select id="pageSize">
      <option value="a4">A4</option>
      <option value="letter">Letter</option>
    </select>
    <select id="orientation">
      <option value="p">عمودي</option>
      <option value="l">أفقي</option>
    </select>
    <button class="convert" onclick="convertToPDF()">تحويل الى PDF 📄</button>
  </div>
  <div class="footer">تم تطويره لعبدالمنعم - يعمل Offline 100%</div>
</div>

<script>
  const { jsPDF } = window.jspdf;
  let images = [];
  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  const preview = document.getElementById('preview');

  dropZone.addEventListener('click', () => fileInput.click());
  dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
  dropZone.addEventListener('drop', (e) => {
    e.preventDefault(); dropZone.classList.remove('dragover');
    handleFiles(e.dataTransfer.files);
  });
  fileInput.addEventListener('change', () => handleFiles(fileInput.files));

  function handleFiles(files) {
    [...files].forEach(file => {
      if(!file.type.startsWith('image/')) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        images.push(e.target.result);
        renderPreview();
      };
      reader.readAsDataURL(file);
    });
  }

  function renderPreview() {
    preview.innerHTML = '';
    images.forEach((src, i) => {
      const div = document.createElement('div');
      div.className = 'img-card';
      div.innerHTML = `<img src="${src}"><button onclick="removeImg(${i})">X</button>`;
      preview.appendChild(div);
    });
  }
  function removeImg(i) { images.splice(i,1); renderPreview(); }

  async function convertToPDF() {
    if(images.length === 0) return alert('اضف صور اولاً يا عبدالمنعم!');
    const orientation = document.getElementById('orientation').value;
    const format = document.getElementById('pageSize').value;
    const pdf = new jsPDF(orientation, 'mm', format);

    for(let i=0; i<images.length; i++) {
      if(i>0) pdf.addPage();
      const props = pdf.getImageProperties(images[i]);
      const pdfWidth = pdf.internal.pageSize.getWidth();
      const pdfHeight = pdf.internal.pageSize.getHeight();
      // تغطية كاملة مع الحفاظ على النسبة
      let imgWidth = pdfWidth;
      let imgHeight = (props.height * pdfWidth) / props.width;
      if(imgHeight > pdfHeight) {
        imgHeight = pdfHeight;
        imgWidth = (props.width * pdfHeight) / props.height;
      }
      const x = (pdfWidth - imgWidth)/2;
      const y = (pdfHeight - imgHeight)/2;
      pdf.addImage(images[i], 'JPEG', x, y, imgWidth, imgHeight);
    }
    pdf.save(`images-${Date.now()}.pdf`);
  }
</script>
</div>
</body>
</html>
